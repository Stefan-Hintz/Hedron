<h1>Hedron 應用程式的隱私權政策</h1>
<p>
Hedron 應用程式不會收集任何個人資料。
</p>
<p>
Hedron 應用程式運作於沙盒環境中，對您 Mac 的存取權限非常有限。
<ul>
<li>列印</li>
<li>僅能讀寫您所選取的檔案</li>
<li>此輔助說明從本機檔案顯示。傳出的網路連線僅用於顯示此輔助說明中連結的維基百科和 Apple 頁面。所有其他連結都會在您的預設網頁瀏覽器中開啟。</li>
<br/>
<li>無傳入的網路連線</li>
<li>沒有相機存取權限</li>
<li>沒有麥克風存取權限</li>
<li>沒有 USB 存取權限</li>
<li>沒有藍牙存取權限</li>
<li>無法存取您的聯絡資訊</li>
<li>無法存取您的位置</li>
<li>無法存取您的行事曆</li>
</ul>
</p>
