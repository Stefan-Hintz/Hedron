<h1>Hedron 应用的隐私政策</h1>
<p>
Hedron 应用不会收集任何个人数据。
</p>
<p>
Hedron 应用运行在沙盒中，对您的 Mac 的访问权限非常有限。
<ul>
<li>打印</li>
<li>仅对您选择的文件进行读写访问</li>
<li>应用内的帮助从本地文件显示。传出网络访问仅用于显示此帮助中链接的维基百科和 Apple 页面。所有其他链接均在您的默认网页浏览器中打开。</li>
<br/>
<li>没有传入网络访问</li>
<li>无摄像头访问权限</li>
<li>无麦克风访问权限</li>
<li>无 USB 访问权限</li>
<li>无蓝牙访问权限</li>
<li>无法访问您的联系人</li>
<li>无法访问您的位置</li>
<li>无法访问您的日历</li>
</ul>
</p>
</body>
</html>
